services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./env/.env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend


  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  minio:
   image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
   container_name: minio
   restart: unless-stopped
   env_file: "./env/.env"
   command: server /data --console-address ":9001"
   volumes:
     - minio_data:/data
   healthcheck:
     test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
     interval: 30s
     timeout: 5s
     retries: 5
     start_period: 10s
   networks:
     - backend


  minio-init:
   image: pgsty/mc:latest
   container_name: minio-init
   depends_on:
     minio:
       condition: service_healthy
   restart: "no"
   env_file: "./env/.env"
   entrypoint: >
     /bin/sh -c "
     mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
     mc mb --ignore-existing local/documents &&
     mc mb --ignore-existing local/avatars &&
     (mc admin user add local \"$$MINIO_APP_ACCESS_KEY\" \"$$MINIO_APP_SECRET_KEY\" || true) &&
     (mc admin policy attach local readwrite --user=\"$$MINIO_APP_ACCESS_KEY\" || true) &&
     echo 'MinIO init done.'
     "
   networks:
     - backend

  nest-server:
   build:
     context: ./backend/nest-server
     dockerfile: Dockerfile
   container_name: nest-server
   restart: unless-stopped
   networks:
     - edge
     - backend
     - monitoring
   env_file: "./env/.env"
   depends_on:
     postgres:
       condition: service_healthy
       restart: true
     redis:
       condition: service_healthy
       restart: true
    #  ai-service:
    #    condition: service_healthy

  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - caddy_data:/data
    networks:
      - edge
    depends_on:
      - nest-server

  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    env_file: "./env/.env"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai-service-worker:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: ai-service-worker
    restart: unless-stopped
    command: ["uv", "run", "arq", "src.worker.WorkerSettings"]
    # worker has no http server, dockerfile healthcheck would fail
    healthcheck:
      disable: true
    networks:
      - backend
    env_file: "./env/.env"
    depends_on:
      ai-service:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    env_file: "./env/.env"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    env_file: "./env/.env"
    entrypoint: >
      /bin/sh -c "
      ollama pull \"$$OLLAMA_GENERATION_MODEL\" &&
      ollama pull \"$$OLLAMA_VISION_MODEL\" &&
      ollama pull \"$$OLLAMA_EMBEDDING_MODEL\" &&
      echo 'ollama modules pulled'
      "
    networks:
      - backend


  grafana: 
    image: grafana/grafana
    profiles: [monitoring]
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - edge
      - monitoring
    env_file:
      - "./env/.env"
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    profiles: [monitoring]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    profiles: [monitoring]
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  redis-data:
  postgres_data:
  minio_data:
  ollama_data:
  grafana_data:
  prometheus_data:
  caddy_data:
