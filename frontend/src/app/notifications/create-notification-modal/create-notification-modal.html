<div class="modal-header">
  <h2 class="modal-title fs-5" id="create-notification-title">{{ 'notifications.create.heading' | transloco }}</h2>
  <button type="button" class="btn-close" [attr.aria-label]="'notifications.create.cancel' | transloco"
    [disabled]="notificationForm().submitting()" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <p class="text-secondary text-break">{{ document()?.filename }}</p>
  <form [formRoot]="notificationForm">
    <fieldset [disabled]="notificationForm().submitting()">
      <app-form-field inputId="notification-title" labelKey="notifications.create.title" [field]="notificationForm.title" />
      <app-form-field inputId="notification-message" type="textarea" labelKey="notifications.create.message" [field]="notificationForm.message" />
      <app-form-field inputId="notification-dueDate" type="date" labelKey="notifications.dueDate" [field]="notificationForm.dueDate" />
      <app-form-field inputId="notification-remindAt" type="datetime-local" labelKey="notifications.create.remindAt"
        hintKey="notifications.create.localTimeHint" [field]="notificationForm.remindAt" />
      @if (notificationForm().errors()[0]?.message; as key) {
        <div class="alert alert-danger" role="alert">{{ key | transloco }}</div>
      }
      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">{{ 'notifications.create.cancel' | transloco }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="notificationForm().submitting()">
          {{ (notificationForm().submitting() ? 'notifications.create.pending' : 'notifications.create.submit') | transloco }}
        </button>
      </div>
    </fieldset>
  </form>
</div>
