global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: laptop
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nest-server
    static_configs:
      - targets: ["nest-server:3000"]

  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:5001"]
